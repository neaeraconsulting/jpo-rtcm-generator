include:
  - jpo-utils/docker-compose.yml

services:
  rtcmgenerator:
    profiles:
      - all
      - rtcm_generator
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_GITHUB_TOKEN: ${MAVEN_GITHUB_TOKEN:?error}
        MAVEN_GITHUB_ORG: ${MAVEN_GITHUB_ORG:?error}
    image: jpo_rtcmgenerator:latest
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:?error}
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      spring.kafka.bootstrap-servers: ${DOCKER_HOST_IP:?error}:9092
      NTRIP_HOST: ${NTRIP_HOST:-}
      NTRIP_PORT: ${NTRIP_PORT:-2101}
      NTRIP_MOUNTPOINT: ${NTRIP_MOUNTPOINT:-}
      NTRIP_USERNAME: ${NTRIP_USERNAME:-}
      NTRIP_PASSWORD: ${NTRIP_PASSWORD:-}
      NTRIP_CONNECT_TIMEOUT_SEC: ${NTRIP_CONNECT_TIMEOUT_SEC:-15}
      NTRIP_SOCKET_TIMEOUT_SEC: ${NTRIP_SOCKET_TIMEOUT_SEC:-15}
      NTRIP_RECONNECT_DELAY_SEC: ${NTRIP_RECONNECT_DELAY_SEC:-5}
      NTRIP_GGA_INTERVAL_SEC: ${NTRIP_GGA_INTERVAL_SEC:-20}
      NTRIP_LATITUDE: ${NTRIP_LATITUDE}
      NTRIP_LONGITUDE: ${NTRIP_LONGITUDE}
      NTRIP_ALTITUDE: ${NTRIP_ALTITUDE}
      NTRIP_OUTPUT_TOPIC: ${NTRIP_OUTPUT_TOPIC:-topic.RGRtcmJson}
      NTRIP_USER_AGENT: ${NTRIP_USER_AGENT:-NTRIP-RTCM-Generator/1.0}
      NTRIP_PREFER_NTRIP_V2: ${NTRIP_PREFER_NTRIP_V2:-true}
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kafka:
        condition: service_healthy
        required: false
