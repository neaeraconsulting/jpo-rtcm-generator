spring:
  application:
    name: rtcm-generator

#General Properties
#==================
groupId: ^project.groupId^
artifactId: ^project.artifactId^
version: ^project.version^
server.port: 8085

# Kafka properties
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
logging:
  level:
    root: INFO
    org.springframework.kafka: info
    org.springframework.web: WARN
    guru.springframework.controllers: WARN
    org.springframework.integration.mqtt: INFO
    us.dot.its.jpo.ode.mec.deposit: ${LOGGING_LEVEL:INFO}
    org.apache.kafka: WARN

j2735.codec:
  # Use a large default value for text encoding, because the XML encodings for RTCM can be quite large
  text-buffer-size: 262144
  # UPER binary is a more compact encoding, so we can use a smaller buffer size.
  uper-buffer-size: 8192
  error-buffer-size: 256
  library-path: /home/libasnapplication.so
  windows-library-path: C:/temp/asnapplication.dll

# Amount of time to wait to try and increase batching
kafka.linger_ms: 50

kafka.topics:
  autoCreateTopics: true
  numPartitions: 1
  numReplicas: 1
  createTopics:
    - name: ${KAFKA_TOPIC_RGRTCMJSON:topic.RGRtcmJson}
      cleanupPolicy: delete
      retentionMs: 300000

ntrip:
  host: ${NTRIP_HOST:}
  port: ${NTRIP_PORT:2101}
  mountpoint: ${NTRIP_MOUNTPOINT:}
  username: ${NTRIP_USERNAME:}
  password: ${NTRIP_PASSWORD:}
  connect-timeout-sec: ${NTRIP_CONNECT_TIMEOUT_SEC:15}
  socket-timeout-sec: ${NTRIP_SOCKET_TIMEOUT_SEC:15}
  reconnect-delay-sec: ${NTRIP_RECONNECT_DELAY_SEC:5}
  gga-interval-sec: ${NTRIP_GGA_INTERVAL_SEC:20}
  fake-lat: ${NTRIP_FAKE_LAT:38.9542}
  fake-lon: ${NTRIP_FAKE_LON:-77.1492}
  fake-alt-m: ${NTRIP_FAKE_ALT_M:30.0}
  ode-json-output-topic: ${NTRIP_ODE_JSON_OUTPUT_TOPIC:topic.RGRtcmJson}
  user-agent: ${NTRIP_USER_AGENT:NTRIP-RTCM-Generator/1.0}
  prefer-ntrip-v2: ${NTRIP_PREFER_NTRIP_V2:true}
